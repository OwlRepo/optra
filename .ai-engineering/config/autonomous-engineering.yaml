autonomy_level: 2

# Structured autonomous work orders stay disabled until a task source is
# configured and the owner activates the pilot in a reviewed PR.
# See docs/ai/autonomous-engineering.md.
activation: PILOT_FROZEN

pilot:
  simulation_required: true
  first_real_task_merge_blocked: true

agents:
  - coordinator
  - product-manager
  - architect
  - implementer
  - reviewer
  - qa
  - reporter

schedule:
  planning: "08:00"
  engineering: "10:00"
  reporting: "19:00"

approval:
  production: required
  destructive_actions: required
  db_migrations: required
  auth_and_workspace_permissions: required
  rate_limits_and_token_budgets: required
  deploy_and_infra: required
  new_dependencies: required

project:
  name: optra
  product_name: Optra
  package_manager: bun@1.2.22
  monorepo: turborepo
  apps:
    - apps/web
    - apps/api
    - apps/e2e
  packages:
    - packages/ai
    - packages/db
    - packages/types
    - packages/ui

validation_commands:
  root:
    - bun run lint
    - bun run type-check
    - bun run build
    - bun run db:seed:test
    - bun run tdd:gate
    - bun run test:scripts
    - bun run agents:lint
    - sh scripts/check-test-layers.sh <base-sha>
  apps/api:
    - bun run test
    - bun run test:cov
    - bun run test:e2e
  apps/web:
    - bun run test
  apps/e2e:
    - bun run test:e2e
  packages/db:
    - bun run test
  packages/ai:
    - bun run test
  packages/ui:
    - bun run test

existing_instructions:
  - AGENTS.md
  - CLAUDE.md
  - DESIGN.md
  - docs/ai/

scheduler:
  activated: false
