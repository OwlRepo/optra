name: CI and Deploy

# One workflow on purpose. Splitting the gate into a separate ci.yml chained by
# `workflow_run` would race: the deploy would run the ci.yml that the DEFAULT
# branch has, not the one on the pushed commit, and the two runs report
# independently. Keeping both jobs here makes `needs: ci` the whole contract —
# main cannot deploy unless the quality gate passed on that exact commit.
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  ci:
    name: Quality gate
    runs-on: ubuntu-latest
    # 45, not 30: the gate now includes API e2e and the Playwright suite.
    timeout-minutes: 45
    # A superseded push should stop burning a runner; nothing outside the runner
    # has changed when CI is cancelled.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Host-side addresses for the dev compose stack started below. These are
      # real process env, and dotenv never overrides an already-set variable, so
      # they win over the .env written in the "Create .env" step — which is why
      # the stale REDIS_PORT/S3 credentials in .env.example cannot leak in.
      DATABASE_URL: postgresql://postgres:postgres@localhost:54322/optra
      REDIS_HOST: localhost
      REDIS_PORT: '6380'
      S3_ENDPOINT: http://localhost:8433
      S3_REGION: us-east-1
      S3_BUCKET: optra-documents
      S3_FORCE_PATH_STYLE: 'true'
    steps:
      # Full history: the test-layer guard below reads every commit in the push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # First, because it is the cheapest failure: code that arrives without
      # the tests for the layers it touches. See scripts/check-test-layers.sh.
      # SHAs are passed as env, never interpolated into the script.
      - name: Tests required for every layer touched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          sh scripts/check-test-layers.spec.sh
          sh scripts/check-test-layers.sh "$BASE_SHA" HEAD

      # .nvmrc pins 22: Node 25 cannot load duckdb's native binding.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Compose interpolates ${OPTRA_*_PORT} and the api/web services declare
      # `env_file: .env`, so the file has to exist even though only the three
      # backing services are started here.
      - name: Create .env for compose
        run: cp .env.example .env

      - name: Start backing services
        run: docker compose up -d --wait --wait-timeout 180 postgres redis seaweedfs

      # Read out of docker/seaweedfs/s3.json rather than repeated here, so that
      # file stays the single place these local-dev credentials are written
      # down. Without them storage.service.spec.ts silently skips instead of
      # round-tripping bytes through SeaweedFS.
      - name: Load local SeaweedFS credentials
        run: |
          node -e "const c = require('./docker/seaweedfs/s3.json').identities[0].credentials[0]; console.log('S3_ACCESS_KEY=' + c.accessKey); console.log('S3_SECRET_KEY=' + c.secretKey)" >> "$GITHUB_ENV"

      - name: Apply database migrations
        run: bun run db:migrate
        working-directory: packages/db

      # @repo/db and @repo/ai resolve through `dist` (their package.json main
      # and types point there; @repo/types and @repo/ui point at src). A clean
      # checkout has no dist, so `tsc --noEmit` cannot find them — it only
      # passes on a developer machine because an earlier build left dist
      # behind. turbo's type-check task depends on ^type-check, not ^build, so
      # it does not produce them either.
      - name: Build typed workspace packages
        run: bunx turbo run build --filter=@repo/db --filter=@repo/ai

      - name: Type-check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      # Unit suites run per workspace rather than through one turbo task: turbo
      # has no `test` task (turbo.json), and a per-workspace step names the
      # failing package in the run summary.
      - name: Unit tests — apps/api
        run: bun run test
        working-directory: apps/api

      - name: Unit tests — apps/web
        run: bun run test
        working-directory: apps/web

      - name: Unit tests — packages/ai
        run: bun run test
        working-directory: packages/ai

      - name: Unit tests — packages/db
        run: bun run test
        working-directory: packages/db

      - name: Unit tests — packages/ui
        run: bun run test
        working-directory: packages/ui

      - name: Unit tests — seed data
        run: bun run db:seed:test

      # Both e2e layers gate deploy. Each gets its own database, dropped and
      # recreated from nothing: the API re-enqueues stale pending/processing
      # rows on boot, so a database shared with another suite hands it that
      # suite's leftovers. prepare-db.ts refuses any name but optra_e2e/optra_pw.
      - name: Prepare API e2e database
        run: bun apps/e2e/scripts/prepare-db.ts optra_e2e

      # Resolves @repo/* from packages/*/dist - built above. No suite reaches a
      # real model: they pass with OpenAI pointed at an unreachable address.
      - name: E2E — apps/api
        run: bun run test:e2e
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:54322/optra_e2e

      # Playwright runs the production entry points (`node dist/main`, the
      # standalone web server), so both apps are built first.
      - name: Build api and web
        run: bunx turbo run build --filter=@repo/api --filter=@repo/web

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e

      # Starts its own OpenAI stub, API (optra_pw, bucket optra-pw) and web
      # server; see apps/e2e/playwright.config.ts.
      - name: E2E — Playwright
        run: bun run test:e2e
        working-directory: apps/e2e

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=100 postgres redis seaweedfs

  deploy:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: VPS_PROD
    timeout-minutes: 30
    # Unlike CI, a deploy must never be cancelled mid-flight: `up -d
    # --force-recreate` can leave the production stack half-replaced. A second
    # push queues behind the first instead of killing it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 25m
          script: |
            set -eu
            cd /home/deploy/apps/optra

            command -v docker >/dev/null
            docker compose version >/dev/null
            test -f docker-compose.prod.yml
            test -f .env

            # Compose auto-reads .env for ${VAR} interpolation on its own.
            # Only DOMAIN is needed here (smoke test). Do NOT source .env — values may
            # contain shell metacharacters like '(' and would break `. ./.env`.
            DOMAIN="$(grep -m1 '^DOMAIN=' .env | cut -d= -f2- | tr -d '\r')"
            COMPOSE_PROFILES="$(grep -m1 '^COMPOSE_PROFILES=' .env | cut -d= -f2- | tr -d '\r' | tr -d '[:space:]' || true)"
            export COMPOSE_PROFILES
            public_ingress_enabled=0
            case ",$COMPOSE_PROFILES," in
              *",public,"*) public_ingress_enabled=1 ;;
            esac

            echo "syncing repository"
            git fetch --prune origin main
            git switch main
            if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
              echo "stashing local deploy checkout changes before update"
              git stash push --include-untracked -m "pre-deploy-$(date +%Y%m%d%H%M%S)"
            fi
            git merge --ff-only origin/main
            echo "checked out $(git rev-parse --short HEAD)"

            # A rollback point for THIS deploy, taken before anything is
            # recreated. The daily off-box backup is a separate workflow with a
            # different purpose; this one exists so a bad migration can be undone.
            #
            # The logic moved to scripts/backup.sh because these eleven lines
            # could not be exercised without a production deploy — so nothing
            # ever had, and the verification was `test -s`, which passes on a
            # dump truncated half-way. The script now proves the archive parses
            # and actually restores before the deploy continues.
            #
            # `--reason=deploy` tolerates a missing postgres container, because
            # a first-ever deploy has none. The scheduled run refuses to.
            sh scripts/backup.sh --reason=deploy

            echo "building images"
            docker compose -f docker-compose.prod.yml build api
            docker compose -f docker-compose.prod.yml build web

            echo "starting production containers"
            if [ "$public_ingress_enabled" -ne 1 ]; then
              echo "bundled Caddy profile disabled; removing old Caddy container if present"
              docker rm -f optra-prod-caddy >/dev/null 2>&1 || true
            fi
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate
            docker compose -f docker-compose.prod.yml ps

            api_ok=0
            for i in $(seq 1 15); do
              docker compose -f docker-compose.prod.yml exec -T api \
                curl -fsS -o /dev/null http://127.0.0.1:3001/health && { api_ok=1; break; }
              echo "api health check retry $i..."; sleep 4
            done
            if [ "$api_ok" -ne 1 ]; then
              echo "api health check failed"
              docker compose -f docker-compose.prod.yml logs --tail=120 api web postgres
              exit 1
            fi

            web_ok=0
            for i in $(seq 1 10); do
              docker compose -f docker-compose.prod.yml exec -T web \
                wget -q -O /dev/null http://127.0.0.1:3000/ && { web_ok=1; break; }
              echo "web health check retry $i..."; sleep 3
            done
            if [ "$web_ok" -ne 1 ]; then
              echo "web health check failed"
              if [ "$public_ingress_enabled" -eq 1 ]; then
                docker compose -f docker-compose.prod.yml logs --tail=120 api web postgres caddy
              else
                docker compose -f docker-compose.prod.yml logs --tail=120 api web postgres
              fi
              exit 1
            fi

            echo "checking production S3 round trip"
            docker compose -f docker-compose.prod.yml exec -T api env NODE_NO_WARNINGS=1 node <<'NODE'
            const {
              CreateBucketCommand,
              DeleteObjectCommand,
              GetObjectCommand,
              HeadBucketCommand,
              PutObjectCommand,
              S3Client,
            } = require('@aws-sdk/client-s3')

            const client = new S3Client({
              endpoint: process.env.S3_ENDPOINT,
              region: process.env.S3_REGION,
              credentials: {
                accessKeyId: process.env.S3_ACCESS_KEY,
                secretAccessKey: process.env.S3_SECRET_KEY,
              },
              forcePathStyle: process.env.S3_FORCE_PATH_STYLE === 'true',
            })

            const bucket = process.env.S3_BUCKET
            const key = `deploy-healthcheck/${Date.now()}-${process.pid}.txt`

            async function ensureBucket() {
              try {
                await client.send(new HeadBucketCommand({ Bucket: bucket }))
                return
              } catch (error) {
                const code = error?.name || error?.Code || error?.$metadata?.httpStatusCode
                if (!['NotFound', 'NoSuchBucket', '404', 404].includes(code)) throw error
              }

              await client.send(new CreateBucketCommand({ Bucket: bucket }))
            }

            async function main() {
              await ensureBucket()
              await client.send(new PutObjectCommand({
                Bucket: bucket,
                Key: key,
                Body: Buffer.from('ok'),
                ContentType: 'text/plain',
              }))

              const result = await client.send(new GetObjectCommand({ Bucket: bucket, Key: key }))
              const chunks = []
              for await (const chunk of result.Body) {
                chunks.push(Buffer.isBuffer(chunk) ? chunk : Buffer.from(chunk))
              }
              const body = Buffer.concat(chunks).toString('utf8')
              await client.send(new DeleteObjectCommand({ Bucket: bucket, Key: key }))

              if (body !== 'ok') {
                throw new Error(`unexpected S3 round-trip body: ${body}`)
              }

              console.log('s3 round trip ok')
            }

            main().catch((error) => {
              console.error(error?.name || error?.Code || 'S3Error')
              console.error(error?.message || String(error))
              process.exit(1)
            })
            NODE

            if [ "$public_ingress_enabled" -eq 1 ]; then
              html="$(mktemp)"
              curl -fsS --max-time 15 "https://${DOMAIN}/" -o "$html" || { echo "public smoke fetch failed"; exit 1; }
              if grep -Eq 'hmr-client|next-devtools|\.next/dev|localhost:[0-9]+|127\.0\.0\.1' "$html"; then
                echo "public smoke check found dev artifacts"; exit 1
              fi
            else
              echo "skipping public HTTPS smoke; set COMPOSE_PROFILES=public only when Optra owns 80/443"
            fi

            echo "deployment completed successfully"
